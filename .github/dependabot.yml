version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain, so routine bumps do not drown the queue.
      dev-tooling:
        patterns: ["pytest*", "ruff", "pyright"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
