name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege by default. `contents: read` is all the test job needs; the
# release job requests `id-token: write` for itself only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c485 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Pyright
        run: pyright
      - name: Pytest
        run: pytest -v

  # Building once rather than per-matrix-entry, then installing the artefact and
  # exercising the console script. A fatal import error shipped in 0.1.0 because
  # the wheel was built but never started.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c485 # v5.4.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Install the built wheel and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "
          import telegram_ads_mcp, telegram_ads_mcp.mcp_server
          print('version:', telegram_ads_mcp.__version__)
          "
          # Initializing over stdio is the real test: it proves the entry point
          # starts a server, not merely that the modules import.
          printf '%s\n' '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2026-07-28\",\"capabilities\":{},\"clientInfo\":{\"name\":\"ci\",\"version\":\"1\"}}}' \
            | /tmp/smoke/bin/telegram-ads-mcp > /tmp/smoke/out.json
          /tmp/smoke/bin/python -c "
          import json, pathlib
          line = pathlib.Path('/tmp/smoke/out.json').read_text().splitlines()[0]
          msg = json.loads(line)
          assert msg['result']['serverInfo']['name'] == 'telegram-ads', msg
          print('stdio handshake OK')
          "

  sdist-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c485 # v5.4.0
        with:
          python-version: "3.13"
      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist
      # The session file is credential-equivalent; it must never ship.
      - name: Assert no credentials in the sdist
        run: |
          python - <<'EOF'
          import tarfile, pathlib
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          names = tarfile.open(sdist).getnames()
          bad = [n for n in names if "auth_state.json" in n or ".venv" in n]
          assert not bad, f"sdist contains secrets or local state: {bad}"
          print(f"sdist OK: {len(names)} entries, no credentials")
          EOF