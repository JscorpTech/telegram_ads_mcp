name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  pypi:
    runs-on: ubuntu-latest
    # A GitHub environment lets you require manual approval before a publish.
    environment:
      name: pypi
      url: https://pypi.org/p/telegram-ads-mcp
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity and
      # returns a token valid for ~15 minutes. No long-lived API token is
      # stored in the repository.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c485 # v5.4.0
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Check the tag matches the packaged version
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys
          tag = os.environ.get("GITHUB_REF_NAME", "")
          version = re.search(
              r'__version__ = "([^"]+)"',
              pathlib.Path("src/telegram_ads_mcp/__init__.py").read_text(),
          ).group(1)
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match version v{version}")
          print(f"tag {tag} matches packaged version")
          EOF
      - name: Confirm no session state is packaged
        run: |
          python - <<'EOF'
          import pathlib, tarfile, zipfile
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = tarfile.open(sdist).getnames() + zipfile.ZipFile(wheel).namelist()
          bad = [n for n in names if "auth_state" in n or ".venv" in n or ".serena" in n]
          assert not bad, f"artefacts contain local state: {bad}"
          print("artefacts clean")
          EOF
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version
      # The registry checks for `mcp-name: <server.json name>` in the package
      # README to prove PyPI ownership, so the PyPI job must land first.
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Verify the listing actually appeared
        run: |
          sleep 5
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.Free-cat/telegram-ads-mcp" \
            | python -m json.tool | head -40