name: Secret scan

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `auth_state.json` is credential-equivalent: it holds live session cookies
  # for ads.telegram.org and can spend the account's TON balance. `.gitignore`
  # is the only other defence, and it cannot stop a forced add or a paste.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A Playwright storage-state file has a recognisable shape: a JSON object with
  # `cookies` and `origins` arrays. Catch it by content, not by filename, so a
  # renamed copy is still flagged.
  session-file-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Look for stored browser sessions in tracked files
        run: |
          python - <<'EOF'
          import json
          import pathlib
          import subprocess
          import sys

          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()

          hit = []
          for name in tracked:
              path = pathlib.Path(name)
              try:
                  text = path.read_text(errors="ignore")
              except (OSError, UnicodeDecodeError):
                  continue
              if '"cookies"' not in text:
                  continue
              try:
                  data = json.loads(text)
              except ValueError:
                  continue
              if isinstance(data, dict) and {"cookies", "origins"} <= data.keys():
                  hit.append(name)

          if hit:
              print("::error::Tracked file(s) look like a Playwright storage state:", hit)
              sys.exit(1)
          print(f"Scanned {len(tracked)} tracked files; no browser session state found.")
          EOF